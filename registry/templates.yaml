templates:
  - id: family_vault
    name: Family Vault
    purpose: Documents, contacts, emergency records, and recovery instructions.
    sensitivity: critical
  - id: family_dashboard
    name: Family Dashboard
    purpose: Overview of members, connectors, weekly review, and audit posture.
    sensitivity: high
  - id: family_weekly_review
    name: Weekly Family Intelligence Review
    purpose: Recurring ritual for tasks, calendar, documents, finances, memories, and decisions.
    sensitivity: high
  - id: family_emergency_pack
    name: Family Emergency Pack
    purpose: Confirmed export of emergency instructions and trusted contacts.
    sensitivity: critical
  - id: lineage_claim_intake
    name: Lineage Claim Intake
    purpose: Quarantined intake for a relationship, event, identity, place, or story assertion.
    sensitivity: high
  - id: evidence_record
    name: Evidence Record
    purpose: Source, provenance, rights, integrity, extraction, and claim links.
    sensitivity: high
  - id: consent_receipt
    name: Consent Receipt
    purpose: Specific, granular, revocable authorization for a purpose, scope, and action.
    sensitivity: critical
  - id: publication_decision
    name: Publication Decision
    purpose: Human-reviewed redaction, rights, consent, rollback, and public-release record.
    sensitivity: high
  - id: succession_policy
    name: Succession Policy
    purpose: Separate emergency, incapacity, and death release rules with guardians and quorum.
    sensitivity: critical
  - id: export_manifest
    name: Family Export Manifest
    purpose: Encrypted, scoped, checksummed family export and restore contract.
    sensitivity: critical
  - id: dpia_outline
    name: Family Intelligence DPIA Outline
    purpose: Privacy-risk assessment structure for hosted family-data processing.
    sensitivity: high
