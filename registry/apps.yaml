  - id: firefly_iii
    name: Firefly III
    category: finance
    upstream: firefly-iii/firefly-iii
    function: Self-hosted personal finance management.
    deployment: { docker: true, self_hosted: true, hosted_option: false }
    family_use_cases: [transactions, budgets, accounts, reports]
    sensitivity: critical
    connector_priority: medium
    mcp_priority: medium
    license_review_required: true
    notes: Finance writes blocked by default.
  - id: vaultwarden
    name: Vaultwarden
    category: vault
    upstream: dani-garcia/vaultwarden
    function: Unofficial Bitwarden-compatible credentials server.
    deployment: { docker: true, self_hosted: true, hosted_option: false }
    family_use_cases: [credentials, emergency_access, shared_secrets]
    sensitivity: critical
    connector_priority: medium
    mcp_priority: low
    license_review_required: true
    notes: Docker image remains vaultwarden/server; no secret read/export tools in MVP.
  - id: home_assistant
    name: Home Assistant
    category: home
    upstream: home-assistant/core
    function: Home automation and sensor intelligence.
    deployment: { docker: true, self_hosted: true, hosted_option: false }
    family_use_cases: [home_status, sensors, presence, energy, safety]
    sensitivity: high
    connector_priority: high
    mcp_priority: medium
    license_review_required: false
    notes: Avoid location and child-presence leakage.
  - id: bookstack
    name: BookStack
    category: knowledgebase
    upstream: BookStackApp/BookStack
    function: Structured family knowledgebase.
    deployment: { docker: true, self_hosted: true, hosted_option: false }
