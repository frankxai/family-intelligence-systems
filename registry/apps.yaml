    sensitivity: high
    connector_priority: medium
    mcp_priority: medium
    license_review_required: false
    notes: Good family canon target.
  - id: outline
    name: Outline
    category: knowledgebase
    upstream: outline/outline
    function: Team knowledgebase usable for family canon.
    deployment: { docker: true, self_hosted: true, hosted_option: true }
    family_use_cases: [knowledgebase, notes, decisions]
    sensitivity: high
    connector_priority: low
    mcp_priority: low
    license_review_required: true
    notes: Confirm license and commercial restrictions before deep integration.

