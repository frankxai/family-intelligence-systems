agents:
  - id: guardian_agent
    display_name: Family Guardian Agent
    category: governance
    purpose: Protect privacy, consent, policy, source integrity, and prompt-injection boundaries.
    default_scope: family
    memory_scope: [policy, audit, consent, provenance]
    can_write: false
    requires_guardian_review: false
    prohibited_actions: [publish_public, export_private_data, override_policy, diagnose]
  - id: documentation_agent
    display_name: Family Documentation Agent
    category: documentation
    purpose: Convert approved family knowledge into manuals, playbooks, library entries, and event notes.
    default_scope: household
    memory_scope: [approved_notes, decisions, playbooks]
    can_write: true
    requires_guardian_review: true
    prohibited_actions: [publish_without_approval, invent_sources]
  - id: research_agent
    display_name: Family Research Agent
    category: research
    purpose: Gather source-grounded research for family decisions and logistics.
    default_scope: household
    memory_scope: [research_briefs, source_index]
    can_write: true
    requires_guardian_review: true
    prohibited_actions: [professional_medical_legal_financial_advice, uncited_claims]
  - id: household_life_agent
    display_name: Household Life Agent
    category: household_ops
    purpose: Coordinate food, groceries, chores, routines, and household maintenance.
    default_scope: household
    memory_scope: [food_preferences, routines, chores, inventory]
    can_write: false
    requires_guardian_review: true
    prohibited_actions: [expose_allergies_broadly, purchase_without_approval]
  - id: gathering_organizer_agent
    display_name: Gathering Organizer Agent
    category: events
    purpose: Plan parties, reunions, holidays, visits, invitations, food, roles, and after-event memory capture.
    default_scope: extended_family
    memory_scope: [events, invitees, roles, dietary_constraints]
    can_write: false
    requires_guardian_review: true
    prohibited_actions: [share_contact_lists_without_consent, publish_photos_without_approval]
  - id: elder_support_agent
    display_name: Elder Support Agent
    category: elder_support
    purpose: Support older family members with logistics, preferences, visits, trusted contacts, and emergency readiness.
    default_scope: family
    memory_scope: [elder_preferences, visit_plans, trusted_contacts]
    can_write: false
    requires_guardian_review: true
    prohibited_actions: [medical_decisions, legal_decisions, reduce_autonomy]
  - id: contact_steward_agent
    display_name: Contact Steward Agent
    category: contact_stewardship
    purpose: Gather, verify, deduplicate, and maintain contact data with consent and provenance.
    default_scope: individual
    memory_scope: [contact_cards, consent, provenance, verification_status]
    can_write: true
    requires_guardian_review: true
    prohibited_actions: [scrape_contacts, infer_sensitive_relationships, bulk_export_without_approval]
  - id: personal_hub_agent
    display_name: Personal Hub Agent
    category: personal_hub
    purpose: Help each member build a private hub, library, profile, and approved contribution queue.
    default_scope: individual
    memory_scope: [private_hub, library, contribution_queue]
    can_write: true
    requires_guardian_review: true
    prohibited_actions: [publish_without_approval, move_private_to_family_scope_without_consent]
  - id: lineage_intake_agent
    display_name: Lineage Intake Agent
    category: lineage_intake
    purpose: Convert untrusted submissions into quarantined candidate claims with provenance and risk flags.
    default_scope: private
    memory_scope: [intake_cases, candidate_claims, attachment_metadata]
    can_write: true
    requires_guardian_review: true
    prohibited_actions: [accept_claim, merge_identity, contact_people, publish, open_unscanned_attachment]
  - id: evidence_assessor_agent
    display_name: Evidence Assessor Agent
    category: evidence
    purpose: Grade sources, map support and contradiction, and prepare neutral evidence matrices.
    default_scope: family
    memory_scope: [evidence_metadata, provenance, source_grades, contradiction_matrix]
    can_write: true
    requires_guardian_review: true
    prohibited_actions: [declare_lineage_true, accept_claim, resolve_sensitive_dispute, publish]
  - id: consent_steward_agent
    display_name: Consent Steward Agent
    category: consent
    purpose: Track specific, revocable permissions and living-person impact.
    default_scope: private
    memory_scope: [consent_receipts, notice_versions, withdrawals, age_transition_reviews]
    can_write: true
    requires_guardian_review: true
    prohibited_actions: [fabricate_consent, broaden_purpose, consent_for_capable_adult, publish]
  - id: dispute_mediator_agent
    display_name: Dispute Mediator Agent
    category: disputes
    purpose: Structure contested claims and evidence without deciding sensitive family truth.
    default_scope: family
    memory_scope: [dispute_metadata, evidence_matrix, requested_remedies]
    can_write: true
    requires_guardian_review: true
    prohibited_actions: [decide_parentage, diagnose_motive, pressure_participant, publish_dispute]
  - id: continuity_custodian_agent
    display_name: Continuity Custodian Agent
    category: succession
    purpose: Prepare emergency and succession checklists, drills, and minimal release packets.
    default_scope: trusted_advisor
    memory_scope: [succession_policy, guardian_designations, drill_results, release_metadata]
    can_write: false
    requires_guardian_review: true
    prohibited_actions: [verify_death, declare_incapacity, release_access, export_secret, bypass_quorum]
  - id: family_historian_agent
    display_name: Family Historian Agent
    category: history
    purpose: Build source-linked timelines, historical context, and biographies while preserving conflicting claims and uncertainty.
    default_scope: family
    memory_scope: [candidate_narratives, timelines, source_index, historical_context, uncertainty]
    can_write: true
    requires_guardian_review: true
    prohibited_actions: [accept_claim, invent_context, erase_contradiction, merge_identity, diagnose_motive, publish]
  - id: family_librarian_agent
    display_name: Family Librarian Agent
    category: library
    purpose: Maintain collections, taxonomy, opaque identifiers, archival descriptions, finding aids, and controlled reading rooms.
    default_scope: family
    memory_scope: [collection_metadata, archival_descriptions, taxonomy, finding_aids, access_conditions]
    can_write: true
    requires_guardian_review: true
    prohibited_actions: [change_sensitivity, widen_access, accept_authenticity, expose_source_uri, publish]
  - id: preservation_steward_agent
    display_name: Preservation Steward Agent
    category: preservation
    purpose: Propose fixity checks, preservation copies, derivatives, migrations, restore drills, and dependency-aware suppression.
    default_scope: private
    memory_scope: [preservation_events, fixity, derivatives, storage_classes, restore_receipts, retention_rules]
    can_write: true
    requires_guardian_review: true
    prohibited_actions: [delete_original, release_hold, deaccession, widen_access, publish, hide_loss]
  - id: jurisdiction_navigator_agent
    display_name: Jurisdiction Navigator Agent
    category: jurisdiction
    purpose: Resolve potentially applicable versioned jurisdiction packs and prepare qualified human review packets.
    default_scope: private
    memory_scope: [jurisdiction_pack_metadata, applicability_inputs, authority_citations, review_status]
    can_write: true
    requires_guardian_review: true
    prohibited_actions: [legal_determination, activate_unreviewed_pack, jurisdiction_shop, override_consent, publish]
  - id: community_authority_liaison_agent
    display_name: Community Authority Liaison Agent
    category: community_authority
    purpose: Identify possible collective or cultural restrictions and prepare community-authority review without claiming representation.
    default_scope: private
    memory_scope: [authority_references, restrictions, appointed_contacts, review_status, repatriation_metadata]
    can_write: true
    requires_guardian_review: true
    prohibited_actions: [represent_community, fabricate_authority, override_restriction, digitize_blocked_material, ai_process_blocked_material, publish]
  - id: open_source_maintainer_agent
    display_name: Open-Source Maintainer Agent
    category: open_source
    purpose: Triage public code and doctrine contributions, run validation, check licenses and provenance, and prepare independently reviewable releases using synthetic fixtures only.
    default_scope: public
    memory_scope: [public_issues, pull_requests, release_metadata, dependency_provenance, synthetic_fixtures]
    can_write: true
    requires_guardian_review: true
    prohibited_actions: [access_private_tenant, use_real_family_fixture, merge_own_change, approve_sensitive_governance, publish_secret, select_license_unilaterally]
